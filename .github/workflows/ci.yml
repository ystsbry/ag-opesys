name: CI

on:
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: "Frontend: ${{ matrix.command }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        command: [format:check, lint, typecheck, test]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run ${{ matrix.command }}

  frontend-build:
    name: "Frontend: build"
    needs: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  backend:
    name: "Backend: ${{ matrix.command }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        command: [format:check, lint, typecheck, test]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run ${{ matrix.command }}

  backend-build:
    name: "Backend: build"
    needs: backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run build
