services:
  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - staff-ui
      - owner-ui
      - worker

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: dev
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ./backend:/app/backend
      - backend_node_modules:/app/backend/node_modules
    environment:
      PORT: 8787
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-ag_opesys}
      AUTH0_DOMAIN: ${AUTH0_DOMAIN:-}
      AUTH0_CLIENT_ID: ${AUTH0_CLIENT_ID:-}
      AUTH0_AUDIENCE: ${AUTH0_AUDIENCE:-}
    command: npm run dev
    depends_on:
      postgres:
        condition: service_healthy

  staff-ui:
    build:
      context: .
      dockerfile: staff-ui/Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ./staff-ui:/app/staff-ui
      - staff_ui_node_modules:/app/staff-ui/node_modules
    command: npx vite --host 0.0.0.0 --port 3000

  owner-ui:
    build:
      context: .
      dockerfile: owner-ui/Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ./owner-ui:/app/owner-ui
      - owner_ui_node_modules:/app/owner-ui/node_modules
    command: npx vite --host 0.0.0.0 --port 3000

  postgres:
    image: postgres:17
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-ag_opesys}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  caddy_data:
  caddy_config:
  backend_node_modules:
  staff_ui_node_modules:
  owner_ui_node_modules:
  postgres_data:
